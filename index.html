

  <!DOCTYPE html>
  <html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Open Graph / Facebook -->

    <meta property="twitter:image" content="https://placehold.co/1200x630/0d1117/58a6ff?text=OQO.SE&font=raleway">

    <!-- Ubuntu Mono Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root { 
        --bg-black: #000000;
        --box-bg: #f8f4f8;
        --box-shadow: rgba(225, 99, 173, 0.15);
        --primary-pink: #e163ad;
        --primary-pink-dark: #c54891;
        --text-dark: #2d1b2e;
        --text-secondary: #6b4c6d;
        --border-light: #e8d5e8;
        --border-pink: #e163ad;
        --input-bg: #ffffff;
        --input-border: #d1b3d1;
        --success-bg: #f0f7f0;
        --success-border: #b8d4b8;
      }
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body { 
        font-family: 'Ubuntu Mono', monospace;
        background-color: var(--bg-black);
        color: var(--text-dark);
        line-height: 1.6;
        min-height: 100vh;
        margin: 0;
        padding: 0;
      }
      
      .main-container {
        width: 100%;
        max-width: 800px;
        background-color: var(--box-bg);
        box-shadow: 0 20px 40px var(--box-shadow);
        overflow: hidden;
        position: relative;
        margin: 0 auto;
        min-height: 100vh;
      }
      
      .header-section {
        background: linear-gradient(135deg, var(--primary-pink) 0%, var(--primary-pink-dark) 100%);
        color: white;
        padding: 40px 30px;
        text-align: center;
        position: relative;
      }
      
      .header-section::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
        opacity: 0.3;
      }
      
      .header-section > * {
        position: relative;
        z-index: 1;
      }
      
      .logo-text {
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
      }
      
      .subtitle {
        font-size: 1.1rem;
        opacity: 0.9;
        font-weight: 400;
      }
      
      .lang-switcher {
        margin-top: 20px;
        display: inline-flex;
        background: rgba(255,255,255,0.2);
        padding: 4px;
        backdrop-filter: blur(10px);
      }
      
      .lang-btn {
        padding: 8px 16px;
        background: transparent;
        border: none;
        color: white;
        font-family: 'Ubuntu Mono', monospace;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      
      .lang-btn.active {
        background: rgba(255,255,255,0.3);
        transform: scale(1.05);
      }
      
      .content-section {
        padding: 40px 30px;
      }
      
      .tab-container {
        display: flex;
        margin-bottom: 30px;
        border-bottom: 2px solid var(--border-light);
      }
      
      .tab-button {
        flex: 1;
        padding: 15px 20px;
        background: none;
        border: none;
        font-family: 'Ubuntu Mono', monospace;
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-secondary);
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: all 0.3s ease;
      }
      
      .tab-button.active {
        color: var(--primary-pink);
        border-bottom-color: var(--primary-pink);
      }
      
      .tab-button:hover:not(.active) {
        color: var(--text-dark);
      }
      
      .upload-zone {
        border: 2px dashed var(--input-border);
        padding: 40px 20px;
        text-align: center;
        transition: all 0.3s ease;
        background: var(--input-bg);
        margin-bottom: 20px;
      }
      
      .upload-zone.dragover {
        border-color: var(--primary-pink);
        background: rgba(225, 99, 173, 0.05);
        transform: scale(1.02);
      }
      
      .upload-icon {
        width: 60px;
        height: 60px;
        margin: 0 auto 20px;
        color: var(--primary-pink);
      }
      
      .form-group {
        margin-bottom: 20px;
      }
      
      .form-label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-dark);
        font-size: 0.95rem;
      }
      
      .form-input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid var(--input-border);
        background: var(--input-bg);
        font-family: 'Ubuntu Mono', monospace;
        font-size: 0.95rem;
        color: var(--text-dark);
        transition: all 0.3s ease;
      }
      
      .form-input:focus {
        outline: none;
        border-color: var(--primary-pink);
        box-shadow: 0 0 0 3px rgba(225, 99, 173, 0.1);
      }
      
      .form-textarea {
        min-height: 200px;
        resize: vertical;
        font-family: 'Ubuntu Mono', monospace;
      }
      
      .btn {
        padding: 12px 24px;
        font-family: 'Ubuntu Mono', monospace;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid transparent;
        text-decoration: none;
        display: inline-block;
        text-align: center;
      }
      
      .btn-primary {
        background: var(--primary-pink);
        color: white;
        border-color: var(--primary-pink);
      }
      
      .btn-primary:hover {
        background: var(--primary-pink-dark);
        border-color: var(--primary-pink-dark);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(225, 99, 173, 0.3);
      }
      
      .btn-secondary {
        background: transparent;
        color: var(--text-dark);
        border-color: var(--input-border);
      }
      
      .btn-secondary:hover {
        border-color: var(--primary-pink);
        color: var(--primary-pink);
      }
      
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none !important;
      }
      
      .file-info {
        background: var(--success-bg);
        border: 2px solid var(--success-border);
        padding: 16px;
        margin-top: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      
      .file-details {
        display: flex;
        align-items: center;
      }
      
      .file-icon {
        width: 40px;
        height: 40px;
        margin-right: 12px;
      }
      
      .file-name {
        font-weight: 600;
        color: var(--text-dark);
        font-size: 0.95rem;
      }
      
      .file-size {
        color: var(--text-secondary);
        font-size: 0.85rem;
      }
      
      .remove-btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-size: 1.5rem;
        cursor: pointer;
        padding: 4px;
        transition: all 0.2s ease;
      }
      
      .remove-btn:hover {
        background: rgba(225, 99, 173, 0.1);
        color: var(--primary-pink);
      }
      
      .progress-container {
        margin: 20px 0;
      }
      
      .progress-bar {
        width: 100%;
        height: 8px;
        background: var(--border-light);
        overflow: hidden;
      }
      
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--primary-pink) 0%, var(--primary-pink-dark) 100%);
        transition: width 0.3s ease;
        width: 0%;
      }
      
      .success-card {
        background: var(--success-bg);
        border: 2px solid var(--success-border);
        padding: 30px;
        text-align: center;
      }
      
      .success-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 10px;
      }
      
      .success-subtitle {
        color: var(--text-secondary);
        margin-bottom: 25px;
      }
      
      .url-container {
        background: white;
        border: 2px solid var(--border-light);
        padding: 16px;
        margin: 20px 0;
      }
      
      .url-input {
        width: 100%;
        background: transparent;
        border: none;
        font-family: 'Ubuntu Mono', monospace;
        font-size: 0.9rem;
        color: var(--text-dark);
        text-align: center;
      }
      
      .url-input:focus {
        outline: none;
      }
      
      .button-group {
        display: flex;
        gap: 12px;
        margin-top: 25px;
      }
      
      .button-group .btn {
        flex: 1;
      }
      
      .hidden {
        display: none !important;
      }
      
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out;
      }
      
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @media (max-width: 768px) {
        .main-container {
          min-height: 100vh;
        }
        
        .header-section {
          padding: 30px 20px;
        }
        
        .logo-text {
          font-size: 2.2rem;
        }
        
        .content-section {
          padding: 30px 20px;
        }
        
        .button-group {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <!-- Header Section -->
      <div class="header-section">
        <div class="logo-text" data-lang="main_title">OQO.SE</div>
        <div class="subtitle" data-lang="main_subtitle">Hosting HTML Gratis & Cepat</div>
        <div class="lang-switcher">
          <button id="lang-id" class="lang-btn active">ID</button>
          <button id="lang-en" class="lang-btn">EN</button>
        </div>
      </div>

      <!-- Content Section -->
      <div class="content-section">
        <div id="uploadContainer" class="animate-fade-in">
          <!-- Tab Navigation -->
          <div class="tab-container">
            <button id="uploadTab" class="tab-button active" data-lang="tab_upload">Unggah File</button>
            <button id="createTab" class="tab-button" data-lang="tab_create">Buat File</button>
          </div>

          <!-- Upload Form -->
          <form id="uploadForm" novalidate>
            <!-- Upload Tab Content -->
            <div id="uploadTabContent">
              <div class="upload-zone" id="dropZone">
                <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l-3 3m3-3l3 3m-10.5 6a9 9 0 1118 0 9 9 0 01-18 0z" />
                </svg>
                <h3 class="text-lg font-semibold mb-2" data-lang="dropzone_title">Seret file (.html) ke sini</h3>
                <p class="text-sm text-gray-600 mb-4" data-lang="dropzone_or">atau</p>
                <input type="file" id="fileInput" class="hidden" accept=".html,.htm" />
                <button type="button" onclick="document.getElementById('fileInput').click()" class="btn btn-secondary" data-lang="btn_choose_file">Pilih File</button>
              </div>
              
              <div id="fileInfo" class="file-info hidden">
                <div class="file-details">
                  <svg class="file-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                  </svg>
                  <div>
                    <div id="fileName" class="file-name"></div>
                    <div id="fileSize" class="file-size"></div>
                  </div>
                </div>
                <button type="button" onclick="clearFile()" class="remove-btn">×</button>
              </div>
            </div>

            <!-- Create Tab Content -->
            <div id="createTabContent" class="hidden">
              <div class="form-group">
                <label for="textFileName" class="form-label" data-lang="label_filename">Nama File</label>
                <input type="text" id="textFileName" class="form-input" data-lang-placeholder="placeholder_filename" placeholder="index.html">
              </div>
              <div class="form-group">
                <label for="textContent" class="form-label" data-lang="label_content">Konten HTML</label>
                <textarea id="textContent" class="form-input form-textarea" data-lang-placeholder="placeholder_content" placeholder="<!DOCTYPE html>..."></textarea>
              </div>
            </div>

            <!-- Progress Bar -->
            <div id="progressContainer" class="progress-container hidden">
              <div class="progress-bar">
                <div id="progressBar" class="progress-fill"></div>
              </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="uploadButton" class="btn btn-primary" style="width: 100%; margin-top: 20px;" data-lang="btn_publish">Terbitkan Halaman</button>
          </form>
        </div>

        <!-- Success Card -->
        <div id="successCard" class="hidden"></div>
      </div>
    </div>

    <script>
      // --- Logika Frontend ---
      const translations = {
        id: {
          meta_title: "OQO.SE // Hosting HTML Gratis & Cepat",
          meta_description: "Layanan gratis untuk hosting halaman web statis. Unggah atau buat file HTML Anda dan dapatkan link publik secara instan di domain OQO.SE.",
          main_title: "OQO.SE",
          main_subtitle: "Hosting HTML Gratis & Cepat",
          tab_upload: "Unggah File",
          tab_create: "Buat File",
          dropzone_title: "Seret file (.html) ke sini",
          dropzone_or: "atau",
          btn_choose_file: "Pilih File",
          label_filename: "Nama File",
          placeholder_filename: "contoh: index.html",
          label_content: "Konten HTML",
          placeholder_content: "<!DOCTYPE html>...",
          btn_publish: "Terbitkan Halaman",
          btn_uploading: "Mengunggah...",
          alert_nofile: "Pilih sebuah file .html untuk diunggah.",
          alert_empty: "Nama file dan konten tidak boleh kosong.",
          alert_wrongfile: "Error: Hanya file .html yang diizinkan.",
          success_title: "Berhasil Diterbitkan!",
          success_subtitle: "Halaman web Anda sekarang sudah tayang.",
          success_url_label: "URL Publik Anda:",
          btn_copy: "Salin",
          btn_copied: "Tersalin!",
          btn_view: "Lihat Halaman",
          btn_upload_another: "Unggah Lagi",
          footer_text: "© 2025 OQO.SE"
        },
        en: {
          meta_title: "OQO.SE - Free & Fast HTML Hosting",
          meta_description: "Free service for hosting static web pages. Upload or create your HTML file and get a public link instantly on the OQO.SE domain.",
          main_title: "OQO.SE",
          main_subtitle: "Free & Fast HTML Hosting",
          tab_upload: "Upload File",
          tab_create: "Create File",
          dropzone_title: "Drag your (.html) file here",
          dropzone_or: "or",
          btn_choose_file: "Choose File",
          label_filename: "Filename",
          placeholder_filename: "e.g., index.html",
          label_content: "HTML Content",
          placeholder_content: "<!DOCTYPE html>...",
          btn_publish: "Publish Page",
          btn_uploading: "Uploading...",
          alert_nofile: "Please select an .html file to upload.",
          alert_empty: "Filename and content cannot be empty.",
          alert_wrongfile: "Error: Only .html files are allowed.",
          success_title: "Published Successfully!",
          success_subtitle: "Your web page is now live.",
          success_url_label: "Your Public URL:",
          btn_copy: "Copy",
          btn_copied: "Copied!",
          btn_view: "View Page",
          btn_upload_another: "Upload Another",
          footer_text: "© 2025 OQO.SE"
        }
      };

      let currentLang = 'id';

      function setLanguage(lang) {
        if (!translations[lang]) return;
        currentLang = lang;
        document.documentElement.lang = lang;
        
        document.title = translations[lang].meta_title;
        document.querySelector('meta[name="description"]').setAttribute('content', translations[lang].meta_description);

        document.querySelectorAll('[data-lang]').forEach(el => {
          const key = el.getAttribute('data-lang');
          if (translations[lang][key]) {
            el.textContent = translations[lang][key];
          }
        });
        document.querySelectorAll('[data-lang-placeholder]').forEach(el => {
          const key = el.getAttribute('data-lang-placeholder');
          if (translations[lang][key]) {
            el.placeholder = translations[lang][key];
          }
        });

        document.getElementById('lang-id').classList.toggle('active', lang === 'id');
        document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      }

      document.getElementById('lang-id').addEventListener('click', () => setLanguage('id'));
      document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));

      const uploadForm = document.getElementById('uploadForm');
      const fileInput = document.getElementById('fileInput');
      const dropZone = document.getElementById('dropZone');
      const fileInfo = document.getElementById('fileInfo');
      const successCard = document.getElementById('successCard');
      const uploadContainer = document.getElementById('uploadContainer');
      const uploadButton = document.getElementById('uploadButton');
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const textFileName = document.getElementById('textFileName');
      const textContent = document.getElementById('textContent');
      let activeTab = 'upload';
      
      const formatFileSize = function formatFileSize(bytes) {
  if (bytes === 0) return '0 Bytes';
  const k = 1024;
  const sizes = ['Bytes', 'KB', 'MB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
};
      
      document.getElementById('uploadTab').addEventListener('click', () => switchTab('upload'));
      document.getElementById('createTab').addEventListener('click', () => switchTab('create'));

      function switchTab(tabName) {
        activeTab = tabName;
        document.getElementById('uploadTab').classList.toggle('active', tabName === 'upload');
        document.getElementById('createTab').classList.toggle('active', tabName === 'create');
        document.getElementById('uploadTabContent').classList.toggle('hidden', tabName !== 'upload');
        document.getElementById('createTabContent').classList.toggle('hidden', tabName !== 'create');
      }

      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; displayFileInfo(e.dataTransfer.files[0]); } });
      fileInput.addEventListener('change', (e) => { if (e.target.files.length) displayFileInfo(e.target.files[0]); });

      function displayFileInfo(file) {
        if (!file.name.toLowerCase().endsWith('.html') && !file.name.toLowerCase().endsWith('.htm')) {
          alert(translations[currentLang].alert_wrongfile);
          clearFile();
          return;
        }
        document.getElementById('fileName').textContent = file.name;
        document.getElementById('fileSize').textContent = formatFileSize(file.size);
        fileInfo.classList.remove('hidden');
      }

      function clearFile() { fileInput.value = ''; fileInfo.classList.add('hidden'); }

      uploadForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        let fileToUpload;
        if (activeTab === 'upload') {
          if (!fileInput.files.length) { alert(translations[currentLang].alert_nofile); return; }
          fileToUpload = fileInput.files[0];
        } else {
          const fileName = textFileName.value.trim();
          const content = textContent.value;
          if (!fileName || !content) { alert(translations[currentLang].alert_empty); return; }
          if (!fileName.toLowerCase().endsWith('.html') && !fileName.toLowerCase().endsWith('.htm')) {
            alert(translations[currentLang].alert_wrongfile);
            return;
          }
          // Buat file dengan MIME type yang benar
          fileToUpload = new File([content], fileName, { type: 'text/html' });
        }
        
        const formData = new FormData();
        formData.append('file', fileToUpload);
        progressContainer.classList.remove('hidden');
        uploadButton.disabled = true;
        uploadButton.textContent = translations[currentLang].btn_uploading;
        progressBar.style.width = '50%';

        try {
          const response = await fetch('/upload', { method: 'POST', body: formData });
          const result = await response.json();
          progressBar.style.width = '100%';
          if (response.ok && result.success) {
            showSuccessCard(result);
          } else {
            throw new Error(result.error || 'Upload failed.');
          }
        } catch (error) {
          alert('Error: ' + error.message);
          resetUploader();
        }
      });

      function showSuccessCard(data) {
        uploadContainer.classList.add('hidden');
        successCard.innerHTML = `<div class="success-card animate-fade-in">
            <h2 class="success-title">${translations[currentLang].success_title}</h2>
            <p class="success-subtitle">${translations[currentLang].success_subtitle}</p>
            <div class="file-info" style="margin: 20px 0;">
              <div class="file-details">
                <svg class="file-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3s-4.5 4.03-4.5 9 2.015 9 4.5 9z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 7.5h-9" />
                </svg>
                <div>
                  <div class="file-name">${data.filename}</div>
                  <div class="file-size">${data.filesize}</div>
                </div>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">${translations[currentLang].success_url_label}</label>
              <div class="url-container">
                <input type="text" value="${data.fileurl}" readonly class="url-input" id="fileUrlSuccess" onfocus="this.select()">
              </div>
              <button onclick="copyToClipboard('fileUrlSuccess', this)" class="btn btn-secondary" style="margin-top: 10px; width: 100%;" data-lang-btn="btn_copy">${translations[currentLang].btn_copy}</button>
            </div>
            <div class="button-group">
              <a href="${data.fileurl}" target="_blank" class="btn btn-primary">${translations[currentLang].btn_view}</a>
              <button onclick="resetUploader()" class="btn btn-secondary">${translations[currentLang].btn_upload_another}</button>
            </div>
          </div>`;
        successCard.classList.remove('hidden');
      }
      
      function resetUploader() {
        successCard.classList.add('hidden');
        successCard.innerHTML = '';
        uploadContainer.classList.remove('hidden');
        clearFile();
        textFileName.value = '';
        textContent.value = '';
        progressContainer.classList.add('hidden');
        progressBar.style.width = '0%';
        uploadButton.disabled = false;
        uploadButton.textContent = translations[currentLang].btn_publish;
      }

      function copyToClipboard(elementId, buttonEl) {
        document.getElementById(elementId).select();
        try {
          document.execCommand('copy');
          const originalText = translations[currentLang].btn_copy;
          buttonEl.textContent = translations[currentLang].btn_copied;
          setTimeout(() => { buttonEl.textContent = originalText; }, 2000);
        } catch (err) {
          alert('Gagal menyalin URL.');
        }
      }
      
      // Atur bahasa awal saat halaman dimuat
      setLanguage('id');
    </script>
